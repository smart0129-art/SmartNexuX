services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: minio server /minio_data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.5.10
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s

  api:
    build:
      context: ./backend
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      MILVUS_URI: http://milvus:19530
      MILVUS_COLLECTION: knowledge_chunks
      EMBEDDING_MODEL: nomic-embed-text
      EMBEDDING_DIMENSION: "768"
      AGENT_MODEL: qwen2.5vl:3b
      AGENT_MAX_TOOL_CALLS: "5"
      CHAT_DEFAULT_PROVIDER: ${CHAT_DEFAULT_PROVIDER:-ollama}
      OLLAMA_CHAT_MODELS: ${OLLAMA_CHAT_MODELS:-qwen2.5vl:3b}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODELS: ${OPENAI_CHAT_MODELS:-gpt-4o-mini}
      DATABASE_PATH: /data/nexux.sqlite3
      SESSION_SECRET: ${SESSION_SECRET:-}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      VISION_MODEL: qwen2.5vl:3b
      CHUNK_MAX_CHARS: "4000"
      CHUNK_OVERLAP_CHARS: "300"
      MAX_UPLOAD_BYTES: "104857600"
      EMBEDDING_BATCH_SIZE: "32"
    ports:
      - "8000:8000"
    volumes:
      - nexux-data:/data
    depends_on:
      milvus:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  etcd-data:
  minio-data:
  milvus-data:
  nexux-data:
